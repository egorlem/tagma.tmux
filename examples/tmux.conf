# Пример подключения темы guezwhoz.tmux.
# Скопируйте тему в ~/.config/tmux/ и добавьте эти строки
# в ~/.tmux.conf или ~/.config/tmux/tmux.conf.

# --- опции темы (до source-file) ---
set -g @gz_status_position 'bottom'   # bottom | top
set -g @gz_transparent     'off'      # on | off
set -g @gz_powerline       'on'       # on | off

# --- подключение темы ---
source-file ~/.config/tmux/guezwhoz.tmux
